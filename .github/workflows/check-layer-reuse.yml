name: Check source-only layer reuse

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker-bake.hcl"
      - "tests/check_layer_reuse.py"
      - ".github/workflows/check-layer-reuse.yml"
  workflow_dispatch:
    inputs:
      before:
        description: "Full upstream commit SHA before a source-only change"
        type: string
        required: true
      after:
        description: "Full upstream commit SHA after the change (same requirements)"
        type: string
        required: true
      base_flavor:
        description: "Runtime to check"
        type: choice
        options: [cpu, nvidia, amd]
        default: cpu

permissions:
  contents: read
  packages: read

jobs:
  layer-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Put BuildKit state on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create --driver local --opt type=none \
            --opt device=/mnt/buildkit-state --opt o=bind buildx_buildkit_ci0_state
      - uses: docker/setup-buildx-action@v4
        with:
          name: ci
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare image layers
        # These immutable fixtures differ only in source, with identical requirements.
        env:
          BEFORE_SHA: ${{ inputs.before || '58700b99e03c022ec1ae158bee18f939731f9322' }}
          AFTER_SHA: ${{ inputs.after || 'ede60e1aefd30ce0f7341c8ff538f48e0fd047c9' }}
          BASE_FLAVOR: ${{ inputs.base_flavor || 'nvidia' }}
        run: python3 tests/check_layer_reuse.py "$BEFORE_SHA" "$AFTER_SHA" --flavor "$BASE_FLAVOR"
