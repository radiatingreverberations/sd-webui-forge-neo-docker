name: Check source-only layer reuse

on:
  workflow_dispatch:
    inputs:
      before:
        description: "Full upstream commit SHA before a source-only change"
        type: string
        required: true
      after:
        description: "Full upstream commit SHA after the change (same requirements)"
        type: string
        required: true
      base_flavor:
        description: "Runtime to check"
        type: choice
        options: [cpu, nvidia, amd]
        default: cpu

permissions:
  contents: read
  packages: read

jobs:
  layer-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Put BuildKit state on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create --driver local --opt type=none \
            --opt device=/mnt/buildkit-state --opt o=bind buildx_buildkit_ci0_state
      - uses: docker/setup-buildx-action@v4
        with:
          name: ci
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare image layers
        env:
          BEFORE_SHA: ${{ inputs.before }}
          AFTER_SHA: ${{ inputs.after }}
          BASE_FLAVOR: ${{ inputs.base_flavor }}
        run: python3 tests/check_layer_reuse.py "$BEFORE_SHA" "$AFTER_SHA" --flavor "$BASE_FLAVOR"
