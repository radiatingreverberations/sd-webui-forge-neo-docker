name: "Docker Bake Build"
description: "Reusable composite action to build and optionally push Docker Bake targets with standardized labeling."
inputs:
  forge_neo_ref:
    description: "Forge Neo branch or tag reference"
    required: true
  image_label:
    description: "Image label, such as latest or neo"
    required: true
  targets:
    description: "Comma or newline separated list of Bake targets to build"
    required: true
  push:
    description: "Whether to push"
    required: false
    default: "true"
  registry:
    description: "Container registry host"
    required: true
    default: "ghcr.io"
  docker_registry_url:
    description: "Full registry URL prefix including trailing slash"
    required: true
  extra_set:
    description: "Additional Bake set lines"
    required: false
    default: ""
  registry_token:
    description: "Token/password for authenticating to the container registry"
    required: false
    default: ""
  github_token:
    description: "GitHub token for authenticated GitHub API requests"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Pre-create BuildKit volume on /mnt
      shell: bash
      run: |
        sudo mkdir -p /mnt/buildkit-state
        sudo docker volume create \
          --driver local \
          --opt type=none \
          --opt device=/mnt/buildkit-state \
          --opt o=bind \
          buildx_buildkit_ci0_state

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        name: ci

    - name: Log in to registry
      if: ${{ inputs.registry_token != '' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}

    # Build from the base image's current digest and record it, so an image whose base has
    # since moved can be found by comparing labels.
    - name: Pin the base image
      id: base_image
      shell: bash
      run: |
        set -euo pipefail
        refs=$(docker buildx bake --print 2>/dev/null | jq -r '[.target[].args.BASE_IMAGE] | unique | .[]')
        if [ "$(printf '%s\n' "$refs" | wc -l)" -ne 1 ]; then
          echo "::error::Expected one base image for this flavor, got: $refs" >&2
          exit 1
        fi
        digest=$(docker buildx imagetools inspect "$refs" --format '{{json .Manifest}}' | jq -r .digest)
        echo "Base image $refs at $digest"
        printf 'ref=%s\ndigest=%s\n' "$refs" "$digest" >>"$GITHUB_OUTPUT"

    - name: Fetch Forge Neo commit SHA
      id: forge_neo_ref
      shell: bash
      run: |
        sha=$(bash "${{ github.action_path }}/../../scripts/resolve-forge-neo-sha.sh" "${{ inputs.forge_neo_ref }}")
        printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"

    - name: Fetch Forge Neo metadata
      id: forge_neo_metadata
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        bash "${{ github.action_path }}/../../scripts/resolve-forge-neo-metadata.sh" \
          "${{ inputs.forge_neo_ref }}" \
          "${{ steps.forge_neo_ref.outputs.sha }}" >>"$GITHUB_OUTPUT"

    - name: Normalize targets list
      id: targets
      shell: bash
      run: |
        echo "input targets: ${{ inputs.targets }}"
        echo "list<<EOF" >>"$GITHUB_OUTPUT"
        echo "${{ inputs.targets }}" | tr ',' '\n' | sed '/^\s*$/d' >>"$GITHUB_OUTPUT"
        echo "EOF" >>"$GITHUB_OUTPUT"

    - name: Build
      uses: docker/bake-action@v7
      with:
        push: ${{ inputs.push == 'true' }}
        set: |
          *.args.FORGE_NEO_VERSION=${{ steps.forge_neo_ref.outputs.sha }}
          *.args.REFRESH_FORGE_NEO=${{ steps.forge_neo_ref.outputs.sha }}
          *.labels.forge-neo.ref=${{ inputs.forge_neo_ref }}
          *.labels.forge-neo.sha=${{ steps.forge_neo_ref.outputs.sha }}
          *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
          *.args.BASE_IMAGE=${{ steps.base_image.outputs.ref }}@${{ steps.base_image.outputs.digest }}
          *.labels.org.opencontainers.image.base.name=${{ steps.base_image.outputs.ref }}
          *.labels.org.opencontainers.image.base.digest=${{ steps.base_image.outputs.digest }}
          ${{ steps.forge_neo_metadata.outputs.bake_set }}
          ${{ inputs.extra_set }}
        targets: ${{ steps.targets.outputs.list }}
